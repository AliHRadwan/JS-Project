<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - MYAA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/signup.css">
</head>
<body>
  <div class="container-fluid signup-viewport">
    <div class="row signup-row g-0">
      <!-- Left Panel -->
      <div class="col-lg-6 d-flex align-items-center justify-content-center auth-left">
        <div class="text-center text-white auth-left-inner">
          <h1 class="display-5 fw-bold mb-2">MYAA</h1>
          <p class="fs-6 mb-0">Join our fashion community</p>
        </div>
      </div>
      
      <!-- Right Panel -->
      <div class="col-lg-6 d-flex align-items-center justify-content-center auth-right">
        <div class="signup-form-wrap">
          <div class="text-center signup-header">
            <h2 class="h4 fw-bold text-dark mb-1">Create Account</h2>
            <p class="text-muted small mb-0">Sign up to start your fashion journey with us</p>
          </div>
          
          <form id="signupForm" class="needs-validation signup-form" novalidate>
            <div class="signup-field">
              <label for="username" class="form-label fw-semibold">Username</label>
              <input type="text" class="form-control form-control-sm" id="username" placeholder="Enter your username" required>
            </div>
            
            <div class="row g-2 signup-field">
              <div class="col-6">
                <label for="firstName" class="form-label fw-semibold">First Name</label>
                <input type="text" class="form-control form-control-sm" id="firstName" placeholder="First name" required>
              </div>
              <div class="col-6">
                <label for="lastName" class="form-label fw-semibold">Last Name</label>
                <input type="text" class="form-control form-control-sm" id="lastName" placeholder="Last name" required>
              </div>
            </div>
            
            <div class="signup-field">
              <label for="email" class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control form-control-sm" id="email" placeholder="Enter your email" required>
            </div>
            
            <div class="row g-2 signup-field">
              <div class="col-6">
                <label for="phone" class="form-label fw-semibold">Phone</label>
                <input type="tel" class="form-control form-control-sm" id="phone" placeholder="Phone number" required>
              </div>
              <div class="col-6">
                <label for="address" class="form-label fw-semibold">Address</label>
                <input type="text" class="form-control form-control-sm" id="address" placeholder="Address" required>
              </div>
            </div>
            
            <div class="row g-2 signup-field">
              <div class="col-6">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control form-control-sm" id="password" placeholder="Min 6 characters" required>
              </div>
              <div class="col-6">
                <label for="confirmPassword" class="form-label fw-semibold">Confirm</label>
                <input type="password" class="form-control form-control-sm" id="confirmPassword" placeholder="Confirm password" required>
              </div>
            </div>
            
            <div class="signup-field signup-terms">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label small fw-medium" for="terms">
                  I agree to the <a href="#" class="text-decoration-none fw-bold">Terms</a> and <a href="#" class="text-decoration-none fw-bold">Privacy Policy</a>
                </label>
              </div>
            </div>
            
            <button type="submit" class="btn btn-dark btn-sm w-100 fw-bold signup-submit">Create Account</button>
          </form>
          
          <div class="text-center signup-footer">
            <p class="text-muted small mb-0">Already have an account? <a href="login.html" class="text-decoration-none fw-semibold">Sign In</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/signup.js"></script>
</body>
</html>
